name: ci

on:
  push:
    branches-ignore:
      - ci-reports
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Write access is only used to publish development reports to the
  # `ci-reports` branch (feature branches only; removed before release).
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_RELEASE_KEY: ${{ secrets.ZENO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ZENO_KEYSTORE_BASE64: ${{ secrets.ZENO_KEYSTORE_BASE64 }}
        run: |
          echo "$ZENO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ZENO_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build, test and lint
        env:
          ZENO_KEYSTORE_PASSWORD: ${{ secrets.ZENO_KEYSTORE_PASSWORD }}
          ZENO_KEY_ALIAS: ${{ secrets.ZENO_KEY_ALIAS }}
          ZENO_KEY_PASSWORD: ${{ secrets.ZENO_KEY_PASSWORD }}
        run: bash tools/ci/gradle-check.sh

      - name: Collect report
        if: always()
        run: python3 tools/ci/collect_report.py

      - name: Publish development report
        if: always() && github.ref_name != 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/publish-report.sh report ci

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zeno-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
