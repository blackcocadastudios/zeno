name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_RELEASE_KEY: ${{ secrets.ZENO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ZENO_KEYSTORE_BASE64: ${{ secrets.ZENO_KEYSTORE_BASE64 }}
        run: |
          echo "$ZENO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ZENO_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build, test and lint
        env:
          ZENO_KEYSTORE_PASSWORD: ${{ secrets.ZENO_KEYSTORE_PASSWORD }}
          ZENO_KEY_ALIAS: ${{ secrets.ZENO_KEY_ALIAS }}
          ZENO_KEY_PASSWORD: ${{ secrets.ZENO_KEY_PASSWORD }}
        run: bash tools/ci/gradle-check.sh

      # What a tag would publish from this commit: the same checks as the release job, nothing published.
      - name: Rehearse the release
        run: python3 tools/ci/release.py app/build/outputs/apk/release "$RUNNER_TEMP/release"

      - name: Collect report
        if: always()
        run: python3 tools/ci/collect_report.py

      # Summary, test and lint reports, and screenshots of every screen.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeno-report
          path: report
          if-no-files-found: warn

      # Also when only lint or tests failed, so the smoke test still runs on what was built.
      - name: Upload the phone APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeno-arm64
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: warn

      - name: Upload the emulator APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeno-x86_64
          path: app/build/outputs/apk/*/*x86_64*.apk
          retention-days: 3
          if-no-files-found: warn

  # Uses the real app on an Android emulator: pages load, the interface
  # responds, uBlock Origin installs, nothing crashes. See tools/ci/smoke.sh.
  smoke:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: zeno-x86_64
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/ci/smoke.sh apks

      # The steps and measurements as an annotation: readable on the run page and through the API.
      - name: Summarize smoke test
        if: always()
        run: python3 tools/ci/annotate.py "Smoke test" smoke-report/steps.md

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeno-smoke
          path: smoke-report
          if-no-files-found: warn

  # Publishes the phone APK on Releases, only once the build (tests and lint
  # included) and the smoke test passed on that commit: on main when the
  # CHANGELOG dates a version that has no release yet, or for a pushed tag
  # vX.Y.Z. See tools/ci/release.py.
  release:
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: zeno-arm64
          path: apks

      - name: Prepare the release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then mode=(--tag "$GITHUB_REF_NAME"); else mode=(--main); fi
          python3 tools/ci/release.py apks dist "${mode[@]}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source dist/release.env
          if [ "$PUBLISH" != true ]; then exit 0; fi
          repo=(--repo "$GITHUB_REPOSITORY")
          if gh release view "$TAG" "${repo[@]}" > /dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              echo "::notice title=Release::$TAG is already published."
              exit 0
            fi
            # The tag's release already exists (made on GitHub, or a re-run): give it the APK and the notes.
            gh release upload "$TAG" "dist/$ASSET" --clobber "${repo[@]}"
            gh release edit "$TAG" --title "$TITLE" --notes-file dist/notes.md --prerelease="$PRERELEASE" "${repo[@]}"
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "dist/$ASSET" --target "$GITHUB_SHA" --title "$TITLE" \
              --notes-file dist/notes.md "${flags[@]}" "${repo[@]}"
          fi
