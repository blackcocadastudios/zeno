# Temporary: fetches design assets (fonts, icon sources) that cannot be
# downloaded from the development environment. Removed before merge.
name: probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fonts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          pip install --quiet fonttools brotli
          mkdir -p report/fonts-full report/fonts report/font-licenses
          for fam in zenkakugothicnew zenmarugothic shipporimincho zenoldmincho mplus1p kleeone bizudpgothic zenkakugothicantique; do
            gh api "repos/google/fonts/contents/ofl/$fam" --jq '.[] | select(.name | test("\\.(ttf|txt)$")) | [.name, .download_url] | @tsv' > /tmp/list.tsv || { echo "no $fam"; continue; }
            while IFS=$'\t' read -r name url; do
              case "$name" in
                *.txt) curl -fsSL -o "report/font-licenses/$fam-$name" "$url" ;;
                *.ttf) curl -fsSL -o "report/fonts-full/$name" "$url" ;;
              esac
            done < /tmp/list.tsv
          done
          ls -la report/fonts-full
          # Latin + Latin Extended-A, punctuation, arrows, and a few decorative kanji.
          UNI="U+0020-007E,U+00A0-017F,U+2010-2027,U+2030-205E,U+20AC,U+2122,U+2190-2199,U+2212,U+3000-3003,U+300C-300D,U+7985,U+7A7A,U+6C34,U+591C,U+9593,U+5186,U+76F8,U+548C,U+9759,U+98A8,U+6708,U+96EA,U+82B1"
          for f in report/fonts-full/*.ttf; do
            b=$(basename "$f" .ttf)
            pyftsubset "$f" --unicodes="$UNI" --layout-features='kern,liga,calt,locl,mark,mkmk,palt,pnum,tnum,lnum,onum' --output-file="report/fonts/$b.ttf" || true
          done
          rm -rf report/fonts-full
          ls -la report/fonts

      - name: Fetch icon sources
        run: |
          set -u
          mkdir -p report/icons/lucide report/icons/material-rounded-300
          cd /tmp
          npm pack lucide-static@latest --silent > /dev/null
          tar xzf lucide-static-*.tgz
          cp package/LICENSE "$GITHUB_WORKSPACE/report/icons/lucide/LICENSE" || true
          node -e "console.log(require('./package/package.json').version)" > "$GITHUB_WORKSPACE/report/icons/lucide/VERSION"
          ls package/icons | sed 's/\.svg$//' > "$GITHUB_WORKSPACE/report/icons/lucide/ALL.txt"
          LUCIDE="arrow-left arrow-right rotate-cw x plus ellipsis-vertical ellipsis search lock lock-open shield shield-check shield-off bookmark bookmark-plus bookmark-check star history clock download arrow-down-to-line settings settings-2 sliders-horizontal share share-2 monitor smartphone puzzle languages text-search file-search sun moon moon-star eye-off venetian-mask trash-2 copy external-link image link house layers square-stack check chevron-down chevron-up chevron-right chevron-left info globe book-open zoom-in a-large-small pin grid-2x2 layout-grid list arrow-up-left circle-x triangle-alert cookie wifi-off ban files file folder-open printer qr-code mic undo-2 refresh-cw square copy-plus app-window panel-bottom panel-top type circle-help heart key-round scan-text clipboard sparkles minus maximize-2 minimize-2 lock-keyhole earth flame leaf wind waves"
          for i in $LUCIDE; do cp "package/icons/$i.svg" "$GITHUB_WORKSPACE/report/icons/lucide/" 2>/dev/null || echo "missing lucide $i"; done
          rm -rf package
          npm pack @material-symbols/svg-300@latest --silent > /dev/null
          tar xzf material-symbols-svg-300-*.tgz
          cp package/LICENSE "$GITHUB_WORKSPACE/report/icons/material-rounded-300/LICENSE" || true
          MAT="arrow_back arrow_forward refresh close add more_vert search lock lock_open shield bookmark bookmark_add star history schedule download settings tune share desktop_windows smartphone extension translate find_in_page light_mode dark_mode bedtime visibility_off delete content_copy open_in_new image link home tab layers check expand_more expand_less chevron_right chevron_left info language menu_book zoom_in text_fields push_pin grid_view list north_west cancel warning cookie wifi_off block folder_open print mic undo tabs"
          for i in $MAT; do cp "package/rounded/$i.svg" "$GITHUB_WORKSPACE/report/icons/material-rounded-300/" 2>/dev/null || echo "missing material $i"; done

      - name: Publish report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/publish-report.sh report assets
