# Every dependency must be justified in docs/PADROES.md ("Dependências").
# Update GeckoView first; the rest follows what it requires.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
geckoview = "158.0.20261019185856"

androidxActivity = "1.13.0"
androidxAnnotationExperimental = "1.4.1"
androidxComposeBom = "2026.09.00"
androidxCore = "1.19.1"
androidxCoreSplashscreen = "1.2.0"
androidxDatastore = "1.2.1"
androidxLifecycle = "2.11.0"
androidxProfileinstaller = "1.4.1"
androidxRoom = "2.8.5"

kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.12.0"

junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.76.0"
turbine = "1.2.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestUiautomator = "2.4.0"

[libraries]
# Build logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle-api", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
