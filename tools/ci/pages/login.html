<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Zeno: entrar</title>
<style>
  body { font-family: sans-serif; margin: 16px; }
  input, button { display: block; width: 100%; font-size: 22px; margin: 8px 0 16px; padding: 12px; box-sizing: border-box; }
</style>
<h1>Entrar no site de teste</h1>
<form method="post" action="logged.html">
  <label>E-mail <input name="email" type="email" autocomplete="username" autofocus></label>
  <label>Senha <input name="password" type="password" autocomplete="current-password"></label>
  <button>Entrar</button>
</form>
<script>
  // The smoke test passes the e-mail in the address (?u=…): typed through adb on a
  // slow emulator, its letters can arrive out of order. The password is still typed.
  const u = new URLSearchParams(location.search).get("u");
  if (u) document.querySelector("[name=email]").value = u;
</script>
</html>
